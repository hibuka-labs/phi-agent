[package]
name = "phi-agent"
version = "0.10.0"
edition = "2024"
description = "phi-agent — General-purpose AI Agent framework (builder factory, renderer, config, session management)"
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-agent"
readme = "README.md"
keywords = ["agent", "ai", "llm", "framework", "cli"]
categories = ["development-tools", "command-line-utilities", "asynchronous"]

[[bin]]
name = "phi"
path = "src/bin/phi/main.rs"
required-features = ["mcp", "telemetry", "logging"]

[dependencies]
agent-base = { version = "0.1.14", path = "../agent-base" }
agent-works = { version = "0.1.7", path = "../agent-works" }
phi-kernel-tools = { version = "0.1.1", default-features = false, path = "../phi-kernel-tools" }
phi-tools = { version = "0.1.5", optional = true, path = "../phi-tools" }
phi-telemetry = { version = "0.1.5", optional = true, path = "../phi-telemetry" }
log-core = { version = "0.1.3", optional = true, path = "../log-core" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
rustyline = "15"

[features]
default = ["file", "mcp", "telemetry", "logging"]
full = ["file", "shell", "mcp", "telemetry", "logging"]

# ── Feature groups ──
protocol      = ["mcp"]
observability = ["telemetry", "logging"]
app           = ["browser"]

# ── Granular feature flags ──
file = ["phi-kernel-tools/file", "agent-works/skill", "agent-works/prompt_skill"]
shell = ["phi-kernel-tools/shell"]
multi-agent = ["phi-kernel-tools/multi-agent"]
mcp = ["agent-works/mcp"]
browser = ["phi-tools", "phi-tools/browser"]
telemetry = ["phi-telemetry"]
logging = ["log-core"]

[dev-dependencies]
tempfile = "3"
futures-core = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "session"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "agent_build"
harness = false

[[bench]]
name = "bridge"
harness = false

[[bench]]
name = "system_prompt"
harness = false

# ── Examples ──

[[example]]
name = "hello_agent"
path = "examples/minimal/hello_agent.rs"

[[example]]
name = "custom_tool"
path = "examples/tools/custom_tool.rs"

[[example]]
name = "custom_policy"
path = "examples/tools/custom_policy.rs"

[[example]]
name = "custom_approval"
path = "examples/tools/custom_approval.rs"

[[example]]
name = "multi_tool"
path = "examples/tools/multi_tool.rs"

[[example]]
name = "file_ops"
path = "examples/tools/file_ops.rs"

[[example]]
name = "focus_demo"
path = "examples/advanced/focus_demo.rs"

[[example]]
name = "html_renderer"
path = "examples/observability/html_renderer.rs"

# ── Phase 2: new examples ──

[[example]]
name = "mcp_client"
path = "examples/mcp/mcp_client.rs"
required-features = ["mcp"]

[[example]]
name = "mcp_dynamic_attach"
path = "examples/mcp/mcp_dynamic_attach.rs"
required-features = ["mcp"]

[[example]]
name = "mcp_server"
path = "examples/mcp/mcp_server.rs"
required-features = ["mcp"]

[[example]]
name = "session_persist"
path = "examples/session/session_persist.rs"

[[example]]
name = "event_log"
path = "examples/observability/event_log.rs"

[[example]]
name = "middleware_hooks"
path = "examples/observability/middleware_hooks.rs"

[[example]]
name = "window_memory"
path = "examples/advanced/window_memory.rs"

[[example]]
name = "summary_memory"
path = "examples/advanced/summary_memory.rs"

[[example]]
name = "hybrid_langgraph"
path = "examples/advanced/hybrid_langgraph.rs"
required-features = ["mcp"]

# ── Phase 3: multi-agent example ──

[[example]]
name = "multi_agent"
path = "examples/multi-agent/multi_agent.rs"

# ── Phase 7: stress tests ──

[[test]]
name = "bridge_concurrent"
path = "tests/stress/bridge_concurrent.rs"
required-features = ["shell"]

[[test]]
name = "bridge_protocol"
path = "tests/stress/bridge_protocol.rs"
required-features = ["shell"]

# bridge_messages only tests message (de)serialization — no runtime deps needed
[[test]]
name = "bridge_messages"
path = "tests/stress/bridge_messages.rs"

# LOCAL DEV ONLY — DO NOT COMMIT
[patch.crates-io]
agent-base = { path = "../agent-base" }
agent-works = { path = "../agent-works" }
phi-kernel-tools = { path = "../phi-kernel-tools" }
