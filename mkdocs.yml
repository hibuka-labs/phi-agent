site_name: phi-agent
site_description: Rust runtime foundation for vertical-domain AI agents — orchestration, sessions, and streaming built in. You bring the tools, prompts, and domain knowledge.
site_url: https://docs.phiagent.dev/
repo_url: https://github.com/hibuka-labs/phi-agent
repo_name: hibuka-labs/phi-agent
copyright: Copyright &copy; 2026 hibuka labs Contributors

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/lang-redirect.js

extra:
  analytics:
    provider: google
    property: G-T4W9LL7DXN
  generator: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav:
            - Home: index.md
            - Getting Started:
                - Quick Start: guide/getting-started/index.md
                - Configuration: guide/getting-started/configuration.md
            - Concepts:
                - Architecture: guide/concepts/architecture.md
                - Focus: guide/concepts/focus.md
                - Memory: guide/concepts/memory.md
                - Skills: guide/concepts/skills.md
                - React Loop Guard: guide/concepts/react-loop-guard.md
            - Tools:
                - Custom Tools: guide/tools/custom-tool.md
                - Kernel Tools: guide/tools/file-tools.md
                - Browser (Extension): guide/tools/browser.md
            - Advanced:
                - Multi-Agent: guide/advanced/multi-agent.md
                - MCP: guide/advanced/mcp.md
                - Session & Snapshots: guide/advanced/session.md
                - Observability: guide/advanced/observability.md
                - Advanced Usage: guide/advanced/advanced.md
            - CLI:
                - CLI Usage: guide/cli/cli.md
                - phi serve: guide/cli/phi-serve.md
            - Reference:
                - API Reference: api.md
                - Community: community.md
        - locale: zh
          name: 中文
          build: true
          nav:
            - 首页: index.md
            - 入门:
                - 快速开始: guide/getting-started/index.md
                - 配置详解: guide/getting-started/configuration.md
            - 概念:
                - 架构设计: guide/concepts/architecture.md
                - Focus 专注判断: guide/concepts/focus.md
                - 记忆: guide/concepts/memory.md
                - Skills 技能: guide/concepts/skills.md
                - 回路守卫: guide/concepts/react-loop-guard.md
            - 工具:
                - 自定义工具: guide/tools/custom-tool.md
                - 内核工具: guide/tools/file-tools.md
                - 浏览器（扩展）: guide/tools/browser.md
            - 进阶:
                - 多 Agent: guide/advanced/multi-agent.md
                - MCP: guide/advanced/mcp.md
                - 会话与快照: guide/advanced/session.md
                - 可观测性: guide/advanced/observability.md
                - 高级用法: guide/advanced/advanced.md
            - CLI:
                - CLI 使用: guide/cli/cli.md
                - phi 服务: guide/cli/phi-serve.md
            - 参考:
                - API 参考: api.md
                - 社区: community.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
